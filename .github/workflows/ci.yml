name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shulefinance
          POSTGRES_USER: shulefinance
          POSTGRES_PASSWORD: shulefinance_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shulefinance -d shulefinance"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://shulefinance:shulefinance_ci@localhost:5432/shulefinance?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-access-secret-at-least-thirty-two-characters
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema packages/database/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
      - run: npm run test:api -- --coverage
      - run: npm run build:api
      - run: npm run build:web
